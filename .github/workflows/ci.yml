name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.sha }}
          # The debug APK is signed with the runner's throwaway debug key, so it will not
          # install over a phone build; these are for inspection only.
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
